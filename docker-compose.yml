version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: guardteck_dispatch_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: automated_dispatch
      MYSQL_USER: dispatch_user
      MYSQL_PASSWORD: dispatch_secure_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dispatch_user", "-pdispatch_secure_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardteck_dispatch_app
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: mysql://dispatch_user:dispatch_secure_pass@mysql:3306/automated_dispatch
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: guardteck_dispatch_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - DB_TYPE=mysqldb
      - DB_MYSQL_DATABASE=automated_dispatch
      - DB_MYSQL_HOST=mysql
      - DB_MYSQL_PORT=3306
      - DB_MYSQL_USER=dispatch_user
      - DB_MYSQL_PASSWORD=dispatch_secure_pass
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  n8n_data:
